name: release

# Publish to PyPI when a version tag (vX.Y.Z) is pushed.
# Prereq: repo secret PYPI_TOKEN (a PyPI API token). Nothing publishes until a
# tag is pushed, and the tag must match the version in pyproject.toml.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  pypi-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Tag must match pyproject version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "tag=$tag pyproject=$ver"
          [ "$tag" = "$ver" ] || { echo "::error::tag $tag != pyproject $ver"; exit 1; }

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
