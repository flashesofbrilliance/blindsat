[project]
name = "blindsat"
version = "0.1.0"
description = "Private SAT pipeline: binary-encoded CNF + LLM solver + secret caller-held decode map. The LLM never sees your variable names."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zach Harris" }]
keywords = ["sat", "solver", "cnf", "privacy", "llm", "name-blind", "obfuscation"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Topic :: Security :: Cryptography",
]
dependencies = ["sympy>=1.12"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/flashesofbrilliance/blindsat"
Repository = "https://github.com/flashesofbrilliance/blindsat"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["sat_private*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]
"examples/*" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["sat_private", "tests"]
