name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Auto-fix ruff (imports)
        run: ruff check --fix --select I .

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests with coverage
        run: |
          pytest -v --cov=sat_private --cov-report=term-missing --cov-fail-under=80

  security:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check no secret state in DIMACS exports
        run: |
          if find . -name '*.cnf' | xargs grep -l '[a-z_]\{4,\}' 2>/dev/null; then
            echo '::error::CNF file may contain unencoded variable names'
            exit 1
          fi
          echo 'CNF clean check passed'

      - name: Check .gitignore covers secret files
        run: |
          grep -q 'caller_secret_state.json' .gitignore || (echo '::error::caller_secret_state.json not in .gitignore' && exit 1)
          grep -q '*.cnf' .gitignore || (echo '::error::*.cnf not in .gitignore' && exit 1)
          echo 'gitignore security check passed'
